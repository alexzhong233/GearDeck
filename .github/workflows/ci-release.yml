name: CI & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version override (e.g. 1.0.2)'
        required: false

permissions:
  contents: write

jobs:
  build-test-package:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Resolve package version
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.event.inputs.version }}".Trim() -ne "") {
            $v = "${{ github.event.inputs.version }}".Trim().TrimStart('v', 'V')
          } elseif ("${{ github.ref }}" -like "refs/tags/v*") {
            $v = "${{ github.ref_name }}".TrimStart('v', 'V')
          } else {
            [xml]$props = Get-Content "Directory.Build.props"
            $v = $props.Project.PropertyGroup.Version.Trim()
          }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Resolved Version: $v"

      - name: Restore and run unit tests
        run: |
          dotnet restore GearDeck.slnx
          dotnet test tests\GearDeck.Tests\GearDeck.Tests.csproj -c Release --no-restore

      - name: Restore and Build GearDeck.Widget and GearDeck.App (Release x64)
        run: |
          msbuild src\GearDeck.Widget\GearDeck.Widget.csproj /t:Restore /p:Configuration=Release /p:Platform=x64
          msbuild src\GearDeck.Widget\GearDeck.Widget.csproj /t:Build /p:Configuration=Release /p:Platform=x64
          msbuild src\GearDeck.App\GearDeck.App.csproj /t:Restore /p:Configuration=Release /p:Platform=x64
          msbuild src\GearDeck.App\GearDeck.App.csproj /t:Build /p:Configuration=Release /p:Platform=x64

      - name: Ensure Inno Setup 6 is installed
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") -and -not (Test-Path "C:\Program Files\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Package Installer (.exe), Portable ZIP, Patch ZIP, and latest.json
        shell: pwsh
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File scripts\package-release.ps1 `
            -Version "${{ steps.ver.outputs.version }}" `
            -RepoSlug "${{ github.repository }}" `
            -Configuration Release `
            -Platform x64 `
            -RequireInstaller

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GearDeck-v${{ steps.ver.outputs.version }}-win-x64
          path: |
            releases/v${{ steps.ver.outputs.version }}/*.exe
            releases/v${{ steps.ver.outputs.version }}/*.zip
            releases/v${{ steps.ver.outputs.version }}/latest.json

      - name: Publish GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: GearDeck ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            releases/v${{ steps.ver.outputs.version }}/GearDeck-Setup-*-win-x64.exe
            releases/v${{ steps.ver.outputs.version }}/GearDeck-v*-win-x64.zip
            releases/v${{ steps.ver.outputs.version }}/GearDeck-patch-v*-win-x64.zip
            releases/v${{ steps.ver.outputs.version }}/latest.json
